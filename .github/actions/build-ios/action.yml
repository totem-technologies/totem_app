# Adapted from https://github.com/cedvdb/action-flutter-build-ios
name: flutter-build-ios
description: Setups the environment to build ios apps with flutter
branding:
  icon: box
  color: green
inputs:
  working-directory:
    description: The root directory of the flutter app within this repository
    default: ./packages/totem_app
  build-cmd:
    description: The full build command, can be used to add arguments
    default: flutter build ipa --release
  flutterfire:
    description: "Whether this project uses flutterfire, this is needed because flutterfire cli adds a post build script..."
    required: false
    default: "true" # we'll setup flutter fire just in case
  certificate-base64:
    description: "base 64 of the p12 certificate"
    required: true
  certificate-password:
    description: "password of the above certificate"
    required: true
  bundle-id:
    description: The bundle identifier to download an App Store profile for
    required: true
  provisioning-profile-name:
    description: The profile name used by the archive and export signing settings
    required: true
  issuer-id:
    description: App Store Connect team API key issuer ID
    required: true
  api-key-id:
    description: App Store Connect API key ID
    required: true
  api-private-key:
    description: Complete App Store Connect API private key contents
    required: true
  keychain-password:
    description: "random string in secrets"
    required: true

runs:
  using: "composite"
  steps:
    # Assumes the Flutter toolchain is already set up by the calling workflow
    # (see .github/actions/setup-environment).
    - name: xcode version
      run: /usr/bin/xcodebuild -version
      shell: bash

    - name: Activate flutterfire
      if: ${{ inputs.flutterfire }} == 'true'
      run: dart pub global activate flutterfire_cli --overwrite
      shell: bash

    # see https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development for more info
    - name: Install the Apple certificate
      shell: bash
      env:
        IOS_BUILD_CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        IOS_BUILD_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        IOS_GITHUB_KEYCHAIN_PASSWORD: ${{ inputs.keychain-password }}
      run: |
        # create variables
        CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        # import certificate from secrets
        printf '%s' "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

        # create temporary keychain
        security create-keychain -p "$IOS_GITHUB_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$IOS_GITHUB_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # import certificate to keychain
        security import "$CERTIFICATE_PATH" -P "$IOS_BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH"

        SIGNING_IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
        printf '%s\n' "$SIGNING_IDENTITIES"
        if ! printf '%s\n' "$SIGNING_IDENTITIES" | grep -Eq '"(Apple|iPhone) Distribution:'; then
          echo "::error::IOS_BUILD_CERTIFICATE_BASE64 must contain a valid distribution certificate and its private key exported together as a .p12. Check certificate expiry and update IOS_BUILD_CERTIFICATE_PASSWORD to the export password."
          exit 1
        fi

        # Allow Apple signing tools to use the private key without a UI prompt.
        security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_GITHUB_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

    - name: Download App Store provisioning profiles
      id: profiles
      uses: apple-actions/download-provisioning-profiles@v6
      with:
        bundle-id: ${{ inputs.bundle-id }}
        profile-type: IOS_APP_STORE
        issuer-id: ${{ inputs.issuer-id }}
        api-key-id: ${{ inputs.api-key-id }}
        api-private-key: ${{ inputs.api-private-key }}

    - name: Install the selected profile for Xcode
      shell: bash
      env:
        DOWNLOADED_PROFILES: ${{ steps.profiles.outputs.profiles }}
        PROFILE_NAME: ${{ inputs.provisioning-profile-name }}
      run: |
        UUID=$(printf '%s' "$DOWNLOADED_PROFILES" | jq -er --arg name "$PROFILE_NAME" '
          [.[] | select(.name == $name and .type == "IOS_APP_STORE")]
          | if length == 1 then .[0].udid
            else error("Expected exactly one active App Store profile named " + $name)
            end
        ')
        # Xcode 16 and later load profiles from their UserData directory.
        PROFILE_DIRECTORY="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
        mkdir -p "$PROFILE_DIRECTORY"
        cp "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision" \
          "$PROFILE_DIRECTORY/$UUID.mobileprovision"

    - name: List profiles
      run: ls "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
      shell: bash

    - name: Build
      # Wrapper retries transient Swift Package Manager download failures.
      run: ${{ github.action_path }}/../../scripts/retry-flutter-build.sh ${{ inputs.build-cmd }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
