name: "Setup build environment"
description: >-
  One-stop build environment setup, run right after checkout by every Flutter CI
  job: installs Flutter and its bundled Dart SDK (optionally Java 17 for Android), composes
  the flavor's .env from config/, and decodes the Firebase/Google service
  secrets. The Flutter/Dart versions are configured by inputs so Web and native
  jobs can use their pinned toolchains without duplicating this setup.

inputs:
  flavor:
    description: "Build flavor: 'development', 'staging' or 'production'."
    required: true
  flutter-version:
    description: "Flutter SDK version to install."
    required: false
    default: "3.50.0-0.2.pre"
  flutter-channel:
    description: "Flutter channel containing the selected SDK."
    required: false
    default: "beta"
  dart-version:
    description: "Expected Dart SDK bundled with the selected Flutter SDK."
    required: false
    default: "3.14.0 (build 3.14.0-315.3.beta)"
  java:
    description: "Also install Java 17 + Gradle cache (needed for Android builds)."
    default: "false"
  firebase_options:
    description: "Base64 encoded firebase_options.dart"
    required: true
  google_services_json:
    description: "Base64 encoded google-services.json (Android)"
    required: false
  google_service_plist:
    description: "Base64 encoded GoogleService-Info.plist (iOS)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Java
      if: ${{ inputs.java == 'true' }}
      uses: actions/setup-java@v5
      with:
        distribution: "zulu"
        java-version: "17.x"
        cache: "gradle"

    - name: Setup Flutter and Dart
      uses: subosito/flutter-action@v2.23.0
      with:
        channel: ${{ inputs.flutter-channel }}
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Verify Flutter and Dart versions
      shell: bash
      run: |
        set -euo pipefail
        flutter --version
        dart --version
        version_json="$(flutter --version --machine)"
        installed_flutter="$(printf '%s\n' "$version_json" | sed -nE 's/.*"flutterVersion": "([^"]+)".*/\1/p')"
        installed_dart="$(printf '%s\n' "$version_json" | sed -nE 's/.*"dartSdkVersion": "([^"]+)".*/\1/p')"
        if [ "$installed_flutter" != "${{ inputs.flutter-version }}" ]; then
          echo "::error::Configured Flutter ${{ inputs.flutter-version }}, but installed ${installed_flutter:-unknown}."
          exit 1
        fi
        if [ "$installed_dart" != "${{ inputs.dart-version }}" ]; then
          echo "::error::Flutter ${{ inputs.flutter-version }} must use bundled Dart ${{ inputs.dart-version }}, but installed ${installed_dart:-unknown}."
          exit 1
        fi

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: flutter pub get

    # Compose packages/*/.env from the layered sources in config/ (the single
    # source of truth, shared with the Makefile env-* targets). setup_env.dart
    # validates the flavor and writes both totem_app/.env and totem_web/.env.
    - name: Compose .env
      shell: bash
      env:
        FLAVOR: ${{ inputs.flavor }}
      run: dart scripts/setup_env.dart "$FLAVOR"

    - name: Decode firebase_options.dart (totem_app)
      shell: bash
      working-directory: ./packages/totem_app
      run: |
        mkdir -p lib
        echo "${{ inputs.firebase_options }}" | base64 -d > lib/firebase_options.dart

    - name: Decode firebase_options.dart (totem_web)
      shell: bash
      working-directory: ./packages/totem_web
      run: |
        mkdir -p lib
        echo "${{ inputs.firebase_options }}" | base64 -d > lib/firebase_options.dart

    - name: Decode google-services.json (Android)
      if: ${{ inputs.google_services_json != '' }}
      shell: bash
      working-directory: ./packages/totem_app
      run: |
        echo "${{ inputs.google_services_json }}" | base64 -d > android/app/google-services.json

    - name: Decode GoogleService-Info.plist (iOS)
      if: ${{ inputs.google_service_plist != '' }}
      shell: bash
      working-directory: ./packages/totem_app
      run: |
        mkdir -p ios/Runner
        echo "${{ inputs.google_service_plist }}" | base64 -d > ios/Runner/GoogleService-Info.plist
