name: "Setup build environment"
description: >-
  One-stop build environment setup, run right after checkout by every Flutter CI
  job: installs Flutter and its bundled Dart SDK (optionally Java 17 for Android), composes
  the flavor's .env from config/, and decodes the Firebase/Google service
  secrets. The Flutter SDK version comes from .flutter-version.

inputs:
  flavor:
    description: "Build flavor: 'development', 'staging' or 'production'."
    required: true
  java:
    description: "Also install Java 17 + Gradle cache (needed for Android builds)."
    default: "false"
  firebase_options:
    description: "Base64 encoded firebase_options.dart"
    required: true
  google_services_json:
    description: "Base64 encoded google-services.json (Android)"
    required: false
  google_service_plist:
    description: "Base64 encoded GoogleService-Info.plist (iOS)"
    required: false

outputs:
  flutter-version:
    description: "Selected Flutter SDK version."
    value: ${{ steps.sdk.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Setup Java
      if: ${{ inputs.java == 'true' }}
      uses: actions/setup-java@v5
      with:
        distribution: "zulu"
        java-version: "17.x"
        cache: "gradle"

    - name: Select Flutter SDK
      id: sdk
      shell: bash
      run: |
        set -euo pipefail
        version="$(cat .flutter-version)"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::.flutter-version must contain a stable Flutter version (e.g. 3.50.0)."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Flutter and Dart
      uses: subosito/flutter-action@v2.23.0
      with:
        channel: stable
        flutter-version: ${{ steps.sdk.outputs.version }}
        cache: true

    - name: Verify Flutter and Dart versions
      shell: bash
      run: |
        set -euo pipefail
        flutter --version
        dart_version="$(dart --version 2>&1)"
        echo "$dart_version"
        version_json="$(flutter --version --machine)"
        installed_flutter="$(jq -er '.flutterVersion | select(type == "string" and length > 0)' <<< "$version_json")"
        flutter_root="$(jq -er '.flutterRoot | select(type == "string" and length > 0)' <<< "$version_json")"
        expected_dart="$(jq -er '.dartSdkVersion | select(type == "string" and length > 0) | if contains(" (build ") then capture("\\(build (?<version>[^)]+)\\)").version else split(" ")[0] end' <<< "$version_json")"
        installed_dart="$(printf '%s\n' "$dart_version" | sed -nE 's/^Dart SDK version: ([^ ]+).*/\1/p')"

        if [ "$installed_flutter" != "${{ steps.sdk.outputs.version }}" ]; then
          echo "::error::Configured Flutter ${{ steps.sdk.outputs.version }}, but installed ${installed_flutter:-unknown}."
          exit 1
        fi
        if [ "$installed_dart" != "$expected_dart" ]; then
          echo "::error::Flutter bundles Dart $expected_dart, but dart on PATH reports ${installed_dart:-unknown}."
          exit 1
        fi
        dart_path="$(command -v dart)"
        if ! [ "$dart_path" -ef "$flutter_root/bin/dart" ] && ! [ "$dart_path" -ef "$flutter_root/bin/cache/dart-sdk/bin/dart" ]; then
          echo "::error::Dart on PATH ($dart_path) is not from the selected Flutter SDK ($flutter_root)."
          exit 1
        fi

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: flutter pub get

    # Compose packages/*/.env from the layered sources in config/ (the single
    # source of truth, shared with the Makefile env-* targets). setup_env.dart
    # validates the flavor and writes both totem_app/.env and totem_web/.env.
    - name: Compose .env
      shell: bash
      env:
        FLAVOR: ${{ inputs.flavor }}
      run: dart scripts/setup_env.dart "$FLAVOR"

    - name: Decode firebase_options.dart (totem_app)
      shell: bash
      working-directory: ./packages/totem_app
      run: |
        mkdir -p lib
        echo "${{ inputs.firebase_options }}" | base64 -d > lib/firebase_options.dart

    - name: Decode firebase_options.dart (totem_web)
      shell: bash
      working-directory: ./packages/totem_web
      run: |
        mkdir -p lib
        echo "${{ inputs.firebase_options }}" | base64 -d > lib/firebase_options.dart

    - name: Decode google-services.json (Android)
      if: ${{ inputs.google_services_json != '' }}
      shell: bash
      working-directory: ./packages/totem_app
      run: |
        echo "${{ inputs.google_services_json }}" | base64 -d > android/app/google-services.json

    - name: Decode GoogleService-Info.plist (iOS)
      if: ${{ inputs.google_service_plist != '' }}
      shell: bash
      working-directory: ./packages/totem_app
      run: |
        mkdir -p ios/Runner
        echo "${{ inputs.google_service_plist }}" | base64 -d > ios/Runner/GoogleService-Info.plist
