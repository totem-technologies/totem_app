name: Build and Draft Release on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create_draft_release:
    name: Create/Update Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Create/Update Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  android:
    name: Android (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: create_draft_release
    defaults:
      run:
        working-directory: ./packages/totem_app

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: staging
            package_name: org.totem.app.dev
            track: ${{ vars.GOOGLE_PLAY_STAGING_TRACK }}
            release_status: ${{ vars.GOOGLE_PLAY_STAGING_RELEASE_STATUS }}
          - flavor: production
            package_name: org.totem.app
            track: ${{ vars.GOOGLE_PLAY_PRODUCTION_TRACK }}
            release_status: ${{ vars.GOOGLE_PLAY_PRODUCTION_RELEASE_STATUS }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          java: "true"
          firebase_options: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          google_services_json: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          flavor: ${{ matrix.flavor }}

      - name: Build Android AppBundle
        uses: ./.github/actions/build-android
        with:
          build-cmd: flutter build appbundle --release --flavor ${{ matrix.flavor }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}

      - name: Rename AAB for clarity
        run: |
          mkdir -p artifacts
          cp build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab \
             artifacts/totem-${{ matrix.flavor }}-${{ github.ref_name }}.aab

      - name: Upload AAB to Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: packages/totem_app/artifacts/*.aab

      - name: Upload AAB to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          node ../../.github/scripts/google-play-upload.mjs \
            --aab artifacts/totem-${{ matrix.flavor }}-${{ github.ref_name }}.aab \
            --package-name "${{ matrix.package_name }}" \
            --track "${{ matrix.track }}" \
            --status "${{ matrix.release_status }}"

  ios:
    name: iOS (${{ matrix.flavor }})
    runs-on: macos-26
    needs: create_draft_release
    defaults:
      run:
        working-directory: ./packages/totem_app

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: production
            export_plist: ios/GithubActionsExportOptions.plist
            provisioning_profile_secret: IOS_MOBILE_PROVISIONING_PROFILE_BASE64
          - flavor: staging
            export_plist: ios/GithubActionsExportOptions-staging.plist
            provisioning_profile_secret: IOS_STAGING_PROVISIONING_PROFILE_BASE64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          firebase_options: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          google_service_plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
          flavor: ${{ matrix.flavor }}

      - uses: ./.github/actions/build-ios
        with:
          build-cmd: flutter build ipa --release --flavor ${{ matrix.flavor }} --export-options-plist=${{ matrix.export_plist }}
          certificate-base64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          provisioning-profile-base64: ${{ secrets[matrix.provisioning_profile_secret] }}
          keychain-password: ${{ secrets.IOS_GITHUB_KEYCHAIN_PASSWORD }}

      - name: Rename IPA for clarity
        run: |
          mkdir -p artifacts
          for ipa in build/ios/ipa/*.ipa; do
            cp "$ipa" "artifacts/totem-${{ matrix.flavor }}-${{ github.ref_name }}.ipa"
          done

      - name: Upload IPA to Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: packages/totem_app/artifacts/*.ipa

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          key_directory="$HOME/.appstoreconnect/private_keys"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_directory"
          chmod 700 "$key_directory"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          trap 'rm -f "$key_path"' EXIT

          xcrun altool --upload-app \
            --type ios \
            --file "artifacts/totem-${{ matrix.flavor }}-${{ github.ref_name }}.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
