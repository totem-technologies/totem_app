name: Flutter Analysis
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-analysis:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          firebase_options: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          flavor: staging

      - name: Run lint
        run: make lint PREPARE_PUB=false

      - name: Run tests
        run: make test PREPARE_PUB=false TEST_PUB=--no-pub
