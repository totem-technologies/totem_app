name: Flutter Analysis
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

jobs:
  package-analysis:
    name: Flutter beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          firebase_options: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          flavor: staging

      - name: Run lint
        run: make lint PREPARE_PUB=false NATIVE_FLUTTER=flutter NATIVE_DART=dart WEB_FLUTTER=flutter WEB_DART=dart

      - name: Run tests
        run: make test PREPARE_PUB=false TEST_PUB=--no-pub NATIVE_FLUTTER=flutter NATIVE_DART=dart WEB_FLUTTER=flutter WEB_DART=dart

  ios-compatibility:
    name: iOS compatibility (Flutter 3.44.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          flutter-version: "3.44.9"
          flutter-channel: stable
          dart-version: "3.12.2"
          firebase_options: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          flavor: staging

      - name: Run native lint
        run: make lint-native PREPARE_PUB=false NATIVE_FLUTTER=flutter NATIVE_DART=dart WEB_FLUTTER=flutter WEB_DART=dart

      - name: Run native tests
        run: make test-native PREPARE_PUB=false TEST_PUB=--no-pub NATIVE_FLUTTER=flutter NATIVE_DART=dart WEB_FLUTTER=flutter WEB_DART=dart
