name: Flutter Analysis
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

jobs:
  package-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          firebase_options: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          flavor: staging

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format --set-exit-if-changed .

      - name: Run analysis
        run: flutter analyze

      - name: Run package tests in parallel
        run: |
          (cd packages/totem_core && flutter test) & core_pid=$!
          (cd packages/totem_app && flutter test) & app_pid=$!
          (cd packages/totem_web && flutter test --platform chrome) & web_pid=$!

          status=0
          wait $core_pid || status=1
          wait $app_pid || status=1
          wait $web_pid || status=1
          exit $status
