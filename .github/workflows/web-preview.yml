name: Web previews

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_BRANCH: ${{ github.event.pull_request.head.ref }}
  PR_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  deploy:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      name: web-preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Temporary TOT-1427 experiment. pubspec.web.beta.lock records only the
      # beta's transitive resolution; no package constraints change. Remove this
      # PR 206 branch after Safari testing; other previews retain the stable Web toolchain.
      - name: Select preview Flutter SDK
        id: sdk
        shell: bash
        run: |
          if [ "$PR_NUMBER" = "206" ]; then
            echo "flutter_version=3.50.0-0.2.pre" >> "$GITHUB_OUTPUT"
            echo "flutter_channel=beta" >> "$GITHUB_OUTPUT"
            echo "dart_version=3.14.0 (build 3.14.0-315.3.beta)" >> "$GITHUB_OUTPUT"
            echo "lockfile_snapshot=pubspec.web.beta.lock" >> "$GITHUB_OUTPUT"
          else
            echo "flutter_version=3.47.7" >> "$GITHUB_OUTPUT"
            echo "flutter_channel=stable" >> "$GITHUB_OUTPUT"
            echo "dart_version=3.13.5" >> "$GITHUB_OUTPUT"
            echo "lockfile_snapshot=pubspec.web.lock" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          flutter-version: ${{ steps.sdk.outputs.flutter_version }}
          flutter-channel: ${{ steps.sdk.outputs.flutter_channel }}
          dart-version: ${{ steps.sdk.outputs.dart_version }}
          lockfile-snapshot: ${{ steps.sdk.outputs.lockfile_snapshot }}
          firebase_options: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          flavor: staging

      - name: Preview address
        id: preview
        run: dart scripts/web_preview.dart

      - name: Build preview
        uses: ./.github/actions/build-web
        with:
          flutter-version: ${{ steps.sdk.outputs.flutter_version }}
        env:
          WEB_ASSET_BASE: ${{ steps.preview.outputs.asset_base }}

      # A PR can close or advance while this build is queued or running.
      - name: Check PR status
        id: current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dart scripts/web_preview.dart current

      - name: Deploy preview
        if: steps.current.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/totem_web
          command: versions upload --env preview --preview-alias ${{ steps.preview.outputs.alias }}

      - name: Comment preview link
        if: steps.current.outputs.deploy == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: web-preview
          message: |
            ### Web preview

            [Open preview](${{ steps.preview.outputs.url }}) · Backend: https://totem.kbl.io

            Built from ${{ github.event.pull_request.head.sha }} with Flutter ${{ steps.sdk.outputs.flutter_version }} (${{ steps.sdk.outputs.flutter_channel }}).
            Staging selects this build for two hours. Open a session to test it.

            [Return to normal staging](https://totem.kbl.io/?room_preview=off)
