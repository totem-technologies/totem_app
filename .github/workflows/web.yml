name: Web

# Web CI/CD for the totem_web package, hosted on Cloudflare Workers.
#
# The app is mounted at /room/ on the Django origin. Django proxies (and patches)
# the HTML document; the Cloudflare Worker serves every other asset as a CDN.
# The bundle is built with --base-href /room/ for routing, and its assets are
# fetched directly from the Worker via Flutter's assetBase (the ASSET_BASE
# web-define). See .github/actions/build-web and packages/totem_web/wrangler.toml.
#
#   PR / push to main  -> build the staging bundle (validation only, no deploy)
#   push tag v*        -> build + deploy the STAGING environment
#   release published  -> build + deploy the PRODUCTION environment
#
# One job handles all of these: the flavor (and whether to deploy) is derived
# from the triggering event, so the build+deploy steps aren't duplicated.
#
# Required repository secrets:
#   FIREBASE_OPTIONS_B64    base64 firebase_options.dart
#   CLOUDFLARE_API_TOKEN    token with Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare account id
#   SENTRY_AUTH_TOKEN       Sentry auth token with source-map upload access
#
# Required repository variables:
#   SENTRY_ORG              Sentry organization slug
#   SENTRY_PROJECT          Sentry project slug
# Optional repository variables:
#   SENTRY_URL              Self-hosted Sentry URL

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    # Production on a published release; staging for PRs, main, tags, dispatch.
    name: Web (${{ github.event_name == 'release' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    env:
      FLAVOR: ${{ github.event_name == 'release' && 'production' || 'staging' }}
      SENTRY_RELEASE: ${{ github.event_name == 'release' && format('totem_web@{0}', github.event.release.tag_name) || startsWith(github.ref, 'refs/tags/v') && format('totem_web@{0}', github.ref_name) || '' }}
      SENTRY_DIST: ${{ github.event_name == 'release' && 'production' || startsWith(github.ref, 'refs/tags/v') && 'staging' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # On a release, build the exact commit the tag points at; otherwise the
          # triggering commit (an empty ref means checkout's default).
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          flutter-version: "3.47.7"
          dart-version: "3.13.5"
          lockfile-snapshot: tool/lockfiles/flutter_3.47.7.lock
          firebase_options: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          flavor: ${{ env.FLAVOR }}

      - name: Build web
        uses: ./.github/actions/build-web
        with:
          flutter-version: "3.47.7"

      - name: Upload Sentry source maps
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        working-directory: packages/totem_web
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
        run: |
          set -euo pipefail
          missing=()
          for variable in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            if [ -z "${!variable:-}" ]; then
              missing+=("$variable")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Sentry source-map upload requires: ${missing[*]}. Configure the repository secret/variables before deploying a web release."
            exit 1
          fi
          dart run sentry_dart_plugin

      - name: Remove source maps over the Worker asset limit
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        working-directory: packages/totem_web
        shell: bash
        run: |
          set -euo pipefail
          find build/web -type f -name '*.map' -size +25M -print -delete

      # Deploy on a published release (production) or a pushed v* tag (staging).
      # PR / main builds stop at the build above, as a compile check.
      - name: Deploy to Cloudflare Workers
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/totem_web
          command: deploy --env ${{ env.FLAVOR }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
