name: totem_web
description: "Guided introspection groups."
publish_to: "none"
version: 0.0.91+91
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  totem_core:
    path: ../totem_core
  dio: ^5.9.2
  degenerate_dio: ^0.5.0
  http: ^1.6.0
  web: ^1.1.1

  sentry_flutter: ^10.0.0

  # State Management
  flutter_riverpod: ^3.3.1

  go_router: ^18.0.1
  url_launcher: ^6.3.2

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  checks: ^0.3.2
  leak_tracker_flutter_testing: any
  sentry_dart_plugin: ^3.4.0

  url_launcher_platform_interface: any

sentry:
  upload_source_maps: true
  upload_sources: true
  upload_debug_symbols: false
  wait_for_processing: true
  commits: false
  legacy_web_symbolication: false

flutter:
  uses-material-design: true

  assets:
    - .env
    - pubspec.yaml
