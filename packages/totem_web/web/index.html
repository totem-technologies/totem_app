<!DOCTYPE html><html><head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Guided introspection groups">
    <meta name="robots" content="noindex, nofollow">

    <!-- Embedded view served under /room/ on the main site, not a standalone web
         app: no PWA install, no app manifest, and no service worker (the bootstrap
         omits serviceWorkerSettings). The favicon is set with an ABSOLUTE URL: the
         /favicon.ico origin fallback doesn't resolve and a relative href would
         break under the /room/ base href. This is the same favicon the Django app
         pages use (e.g. /spaces/); the unhashed path is stable across redeploys. -->
    <link rel="icon" href="https://cdn.totem.org/static/images/favicons/favicon.ico">

    <title>Totem</title>

    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

    <style>
      body {
        margin: 0;
        /* AppTheme.cream: anything the Flutter view doesn't cover (e.g. mobile
           browser chrome resizing) would otherwise be white. */
        background: #F3F1E9;
      }
    </style>
  <style id="video-clip-style">
    /* Firefox skips the clip-path Flutter puts on a platform view's wrapper
       when the child is a <video>, so rounded video tiles render square. Any
       radius on the video itself makes Firefox honor the wrapper's clip.
       0.5px is too small to see; measured CPU cost is within noise. */
    @supports (-moz-appearance: none) {
      video {
        border-radius: 0.5px;
      }
    }
  </style>

</head>
  <body>

    <!-- Inline the bootstrap (incl. our custom flutter_bootstrap.js with
         ASSET_BASE) so no separate /room/flutter_bootstrap.js request is needed:
         Django serves only this HTML doc, the CDN serves everything else. -->
    <script>{{flutter_bootstrap_js}}</script>


</body></html>
